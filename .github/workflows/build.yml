name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew -Pplatform=common :common:check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/verify_assets.py
  platform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [paper, fabric, forge, neoforge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew -Pplatform=${{ matrix.platform }} :${{ matrix.platform }}:build
      - uses: actions/upload-artifact@v4
        with:
          name: HiraganaBlock-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.platform }}/build/libs/*.jar
          if-no-files-found: error
