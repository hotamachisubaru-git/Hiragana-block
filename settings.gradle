pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
    }
}
rootProject.name = 'HiraganaBlock'
include 'common'
def platform = providers.gradleProperty('platform').getOrElse('paper')
if (!['common', 'paper', 'fabric', 'forge', 'neoforge'].contains(platform)) {
    throw new GradleException("Unknown platform: ${platform}")
}
if (platform != 'common') include platform
