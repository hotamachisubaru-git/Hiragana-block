plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
sourceSets.main.resources.srcDir rootProject.file('assets/catalog')
sourceSets {
    selfTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('selfTest', JavaExec) {
    dependsOn selfTestClasses
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'org.hotamachisubaru.hiraganablock.core.CoreTest'
}
check.dependsOn selfTest
