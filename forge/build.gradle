plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.36' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client { workingDirectory project.file('run'); mods { hiraganablock { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { hiraganablock { source sourceSets.main } } }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
sourceSets.main.java.srcDirs rootProject.file('common/src/main/java'), rootProject.file('common/src/minecraft/java')
sourceSets.main.resources.srcDirs rootProject.file('assets/catalog'), rootProject.file('assets/generated'), rootProject.file('assets/data-legacy')
processResources { filesMatching('META-INF/mods.toml') { expand(version: project.version, minecraft_version: minecraft_version, forge_version: forge_version) } }
jar { archiveBaseName = "HiraganaBlock-forge-mc${minecraft_version}"; from rootProject.file('LICENSE'); from(rootProject.file('assets/OFL-NotoSansJP.txt')); finalizedBy 'reobfJar' }
