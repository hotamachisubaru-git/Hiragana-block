plugins { id 'java'; id 'net.neoforged.moddev' version "${moddev_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { hiraganablock { sourceSet sourceSets.main } }
}
sourceSets.main.java.srcDirs rootProject.file('common/src/main/java'), rootProject.file('common/src/minecraft/java')
sourceSets.main.resources.srcDirs rootProject.file('assets/catalog'), rootProject.file('assets/generated'), rootProject.file('assets/data-modern')
processResources { filesMatching('META-INF/neoforge.mods.toml') { expand(version: project.version, minecraft_version: minecraft_version, neo_version: neo_version) } }
jar { archiveBaseName = "HiraganaBlock-neoforge-mc${minecraft_version}"; from rootProject.file('LICENSE'); from(rootProject.file('assets/OFL-NotoSansJP.txt')) }
